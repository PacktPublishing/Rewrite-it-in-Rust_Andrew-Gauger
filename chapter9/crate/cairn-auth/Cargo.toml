[package]
name = "cairn-auth"
version = "0.1.0"
edition.workspace = true
publish.workspace = true

[dependencies]
axum = "0.8"
base64 = "0.23.1"
openidconnect = "4.0.1"
postgres-protocol = "0.6.12"
rand = "0.10.3"
serde = { version = "1.0.229", features = ["derive"] }
sha2 = "0.11.1"
sqlx = { version = "0.9.0", default-features = false, features = ["postgres", "runtime-tokio", "tls-rustls", "uuid"] }
tokio = { version = "1.54.1", features = ["macros", "rt-multi-thread", "net", "sync", "signal"] }
tracing = "0.1.44"
tracing-subscriber = "0.3.23"
url = "2.5.8"
uuid = { version = "1.29.0", features = ["serde"] }

[dev-dependencies]
serde_json = "1.0.154"
uuid = { version = "1.29.0", features = ["v4"] }
