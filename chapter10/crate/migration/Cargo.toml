[package]
name = "migration"
version = "0.1.0"
edition.workspace = true
publish.workspace = true

[dependencies]
async-trait = "0.1.92"
sea-orm-migration = { version = "2.0.4", default-features = false, features = ["runtime-tokio-rustls", "sqlx-postgres", "cli"] }
tokio = { version = "1.54.1", features = ["macros", "rt-multi-thread"] }

[dev-dependencies]
sqlx = { version = "0.9.0", default-features = false, features = ["postgres", "runtime-tokio"] }
