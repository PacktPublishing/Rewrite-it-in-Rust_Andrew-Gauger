[package]
name = "cairn-forms"
version = "0.1.0"
edition.workspace = true
publish.workspace = true
description = "Cairn's form kit: Access-style bound forms, lookups and datasheets on egui."

[dependencies]
cairn-core = { version = "0.1.0", path = "../cairn-core" }
cairn-forms-derive = { version = "0.1.0", path = "../cairn-forms-derive" }
egui = "0.37"
egui_extras = "0.37"
egui_form = { version = "0.11", default-features = false }
rust_decimal = "1.43"
