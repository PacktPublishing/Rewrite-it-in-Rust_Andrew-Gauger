[package]
name = "{{ project_name }}"
version = "0.1.0"
edition = "2021"
description = "An egui desktop app"
license = "MIT OR Apache-2.0"

[dependencies]
egui.bp-managed = true
eframe.bp-managed = true
tokio.bp-managed = true
sqlx.bp-managed = true
egui_extras.bp-managed = true
egui_form.bp-managed = true
{%- if form_kit or derive_macro %}
{{ crate_name }}_forms = { path = "forms", package = "{{ project_name }}-forms" }

[workspace]
members = ["forms"{% if derive_macro %}, "forms-derive"{% endif %}]
{%- endif %}
